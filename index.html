<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to Speedrun.com Viewer...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Redirecting...</h1>
        <p>This site has moved to a new location.</p>
        <p>If you are not redirected automatically, <a href="#" id="manual-link">click here</a>.</p>
    </div>

    <script>
        (function() {
            // 現在のURLを解析
            var currentUrl = window.location.href;
            var currentPath = window.location.pathname;
            var currentSearch = window.location.search;
            var currentHash = window.location.hash;

            // 新しいベースURL
            var newBaseUrl = 'https://mcrtabot.github.io/srcviewer';

            // パスから /srclens を除去
            // 例: /srclens/leaderboard -> /leaderboard
            var newPath = currentPath.replace(/^\/srclens/, '');

            // 新しいURLを構築
            var newUrl = newBaseUrl + newPath + currentSearch + currentHash;

            // 手動リンクも更新
            document.getElementById('manual-link').href = newUrl;

            // 即座にリダイレクト
            window.location.replace(newUrl);
        })();
    </script>
</body>
</html>
